<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Радар вакансий</title>
<link rel="icon" href="logo-96.webp">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Мини-приложение Радара: стеклянные карточки МЭТЧ, избранное и список; цвета берутся из темы Telegram */
:root{
  --bg:#f5f5f7; --ink:#1d1d1f; --muted:#6e6e73; --accent:#0071e3; --accent-ink:#fff;
  --good:#1a7f37; --bad:#d70015; --line:rgba(0,0,0,.08);
  --glass:rgba(255,255,255,.55); --glass-strong:rgba(255,255,255,.75); --glass-soft:rgba(255,255,255,.35);
  --edge:rgba(255,255,255,.75); --hi:rgba(255,255,255,.95);
  --shadow:0 1px 2px rgba(0,0,0,.05),0 18px 44px -20px rgba(30,40,90,.3);
  --orb1:rgba(0,113,227,.28); --orb2:rgba(175,82,222,.24); --orb3:rgba(48,209,200,.22);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
}
:root.dark{
  --bg:#000; --ink:#f5f5f7; --muted:#a1a1a6; --accent:#2997ff; --good:#30d158; --bad:#ff453a; --line:rgba(255,255,255,.1);
  --glass:rgba(40,40,46,.5); --glass-strong:rgba(48,48,54,.7); --glass-soft:rgba(60,60,68,.32);
  --edge:rgba(255,255,255,.14); --hi:rgba(255,255,255,.22);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 22px 50px -20px rgba(0,0,0,.8);
  --orb1:rgba(41,151,255,.3); --orb2:rgba(191,90,242,.26); --orb3:rgba(48,209,200,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);letter-spacing:-.02em;-webkit-font-smoothing:antialiased;overflow:hidden}
.backdrop{position:fixed;inset:-20vmax;z-index:0;pointer-events:none;
  background:radial-gradient(45vmax 45vmax at 10% 15%,var(--orb1),transparent 70%),radial-gradient(40vmax 40vmax at 90% 30%,var(--orb2),transparent 70%),radial-gradient(45vmax 45vmax at 60% 95%,var(--orb3),transparent 70%)}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--hi),var(--shadow)}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
header{display:flex;align-items:center;gap:10px;padding:4px 2px 10px}
header img{width:34px;height:34px;border-radius:10px;box-shadow:0 4px 12px -4px rgba(0,0,0,.45)}
header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.03em;flex:1}
header .upd{font-size:12px;color:var(--muted);text-align:right}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.view[hidden]{display:none}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:110px}

/* МЭТЧ */
.deck{position:relative;flex:1;min-height:0;margin:2px 2px 0}
.card{position:absolute;inset:0;border-radius:28px;display:flex;flex-direction:column;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.card.back{transform:scale(.94) translateY(16px);opacity:.55}
.card.fly{transition:transform .32s cubic-bezier(.4,0,.6,1),opacity .32s}
.card.snap{transition:transform .28s cubic-bezier(.2,.9,.3,1.2)}
.c-head{padding:20px 20px 10px;display:flex;flex-direction:column;gap:6px}
.c-src{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.c-title{font-size:25px;line-height:1.12;font-weight:700;letter-spacing:-.03em;overflow-wrap:anywhere}
.c-comp{font-size:16px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:12.5px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--glass-soft);box-shadow:inset 0 0 0 1px var(--edge);color:var(--muted);white-space:nowrap}
.chip.money{color:var(--good)}
.c-body{flex:1;min-height:0;overflow-y:auto;padding:4px 20px 14px;font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text;
  -webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}
.c-foot{padding:12px 20px 16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;align-items:center}
.c-foot .lbl{font-size:12px;color:var(--muted)}
a{color:var(--accent);text-decoration:none}
.stamp{position:absolute;top:22px;padding:6px 14px;border-radius:999px;color:#fff;font-weight:700;font-size:14px;opacity:0;z-index:3}
.stamp.no{right:18px;background:var(--bad)} .stamp.yes{left:18px;background:var(--good)}
.btns{display:flex;justify-content:center;align-items:center;gap:22px;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px) + 64px)}
.round{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:26px;cursor:pointer;color:var(--ink);background:var(--glass-strong)}
.round.no{color:var(--bad)} .round.yes{color:var(--accent)}
.round.undo{width:46px;height:46px;font-size:18px;color:var(--muted)}
.round:active{transform:scale(.94)}
.round[disabled]{opacity:.35}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px;color:var(--muted)}
.empty b{color:var(--ink);font-size:20px;letter-spacing:-.02em}

/* списки */
.list{display:flex;flex-direction:column;gap:10px;padding:2px}
.item{border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.item .t{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.item .m{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.item .row{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:14px;align-items:center}
.item .row button{font:inherit;color:var(--bad);background:none;border:0;padding:0;cursor:pointer}
.item details summary{cursor:pointer;color:var(--accent);font-size:14px;list-style:none}
.item details p{white-space:pre-wrap;font-size:14px;margin:8px 0 0;overflow-wrap:anywhere}
.search{width:100%;padding:11px 14px;border-radius:14px;font:inherit;color:var(--ink);margin:0 0 10px;outline:none}
.note{font-size:13px;color:var(--muted);text-align:center;padding:6px 10px}

/* таб-бар */
.tabbar{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));
  display:flex;gap:2px;padding:4px;border-radius:999px;max-width:calc(100% - 28px)}
.tabbar button{font:inherit;font-size:14px;font-weight:600;border:0;background:none;color:var(--ink);opacity:.7;padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tabbar button[aria-selected="true"]{opacity:1;background:var(--glass-strong);box-shadow:inset 0 1px 0 var(--hi),0 2px 8px -2px rgba(0,0,0,.2)}
.tabbar .n{font-size:12px;color:var(--muted);margin-left:5px;font-weight:500}
.toast{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));
  padding:8px 16px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:calc(100% - 28px);overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.card.fly,.card.snap,.toast{transition:none}}
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<div class="app">
  <header>
    <img src="logo-96.webp" alt="">
    <h1>Радар вакансий</h1>
    <span class="upd" id="upd"></span>
  </header>
  <main>
    <section class="view" id="v-match">
      <div class="deck" id="deck"></div>
      <div class="btns">
        <button class="round no glass" id="b-no" aria-label="Пропустить">✕</button>
        <button class="round undo glass" id="b-undo" aria-label="Вернуть" disabled>↶</button>
        <button class="round yes glass" id="b-yes" aria-label="В избранное">♥</button>
      </div>
    </section>
    <section class="view scroll" id="v-fav" hidden><div class="list" id="fav"></div></section>
    <section class="view scroll" id="v-all" hidden>
      <input class="search glass" id="q" type="search" placeholder="Поиск по вакансиям">
      <div class="list" id="all"></div>
    </section>
  </main>
</div>
<nav class="tabbar glass" role="tablist">
  <button role="tab" data-v="match" aria-selected="true">МЭТЧ<span class="n" id="n-match"></span></button>
  <button role="tab" data-v="fav" aria-selected="false">Избранное<span class="n" id="n-fav"></span></button>
  <button role="tab" data-v="all" aria-selected="false">Все<span class="n" id="n-all"></span></button>
</nav>
<div class="toast glass" id="toast"></div>

<script>
(function(){
"use strict";
var tg = window.Telegram && window.Telegram.WebApp;
var $ = function(id){ return document.getElementById(id); };
function h(tag, attrs, kids){ var el=document.createElement(tag); if(attrs) for(var k in attrs){ var v=attrs[k];
  if(v==null||v===false) continue; if(k==="class") el.className=v; else if(k==="text") el.textContent=v;
  else if(k.slice(0,2)==="on") el.addEventListener(k.slice(2),v); else el.setAttribute(k,v);} (kids||[]).forEach(function(c){ if(c) el.append(c); }); return el; }
function str(v){ return typeof v==="string"?v:(v==null?"":String(v)); }
function safeUrl(u){ return /^https?:\/\//i.test(str(u)) ? u : null; }
var MONTHS=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
function fmt(s){ var d=new Date(s); if(!s||isNaN(d)) return ""; var now=new Date(), a=new Date(now.getFullYear(),now.getMonth(),now.getDate()), b=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  var diff=Math.round((a-b)/864e5); return diff===0?"сегодня":diff===1?"вчера":d.getDate()+" "+MONTHS[d.getMonth()]; }

/* ---------- тема ---------- */
function applyTheme(){
  var dark = tg ? tg.colorScheme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.classList.toggle("dark", dark);
  if (tg){ try{ tg.setHeaderColor(dark?"#000000":"#f5f5f7"); tg.setBackgroundColor(dark?"#000000":"#f5f5f7"); }catch(_){} }
}
if (tg){ tg.ready(); tg.expand(); try{ tg.disableVerticalSwipes && tg.disableVerticalSwipes(); }catch(_){} tg.onEvent("themeChanged",applyTheme); }
applyTheme();
var haptic = function(t){ try{ tg && tg.HapticFeedback && (t==="s"?tg.HapticFeedback.selectionChanged():tg.HapticFeedback.impactOccurred(t)); }catch(_){} };

/* ---------- состояние ---------- */
var S = { data:null, dec:{}, sent:{}, undo:null, busy:false, drag:false };
var KEY="radar_dec", KEY_SENT="radar_sent", BOT="gskwork_bot";
var hasCS = !!(tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9"));
function loadKey(key){
  return new Promise(function(ok){
    var fromLocal=function(){ try{ ok(JSON.parse(localStorage.getItem(key)||"{}")); }catch(_){ ok({}); } };
    if (hasCS) tg.CloudStorage.getItem(key,function(err,val){ if(err||!val) fromLocal(); else { try{ ok(JSON.parse(val)); }catch(_){ fromLocal(); } } });
    else fromLocal();
  });
}
function loadDec(){ return Promise.all([loadKey(KEY),loadKey(KEY_SENT)]).then(function(r){ S.sent=r[1]||{}; return r[0]; }); }
function saveKey(key,obj,cb){
  var s=JSON.stringify(obj); try{ localStorage.setItem(key,s); }catch(_){}
  if (hasCS && s.length<4000){ try{ tg.CloudStorage.setItem(key,s,function(){ cb&&cb(); }); return; }catch(_){} }
  cb&&cb();
}
function saveDec(cb){
  Object.keys(S.sent).forEach(function(id){ if(!(id in S.dec)) delete S.sent[id]; });
  var left=2, done=function(){ if(--left===0&&cb) cb(); };
  saveKey(KEY,S.dec,done); saveKey(KEY_SENT,S.sent,done);
  updateMainButton();
}
/* решение уже учтено в данных, если вакансия в избранном (f) или её уже нет в выгрузке (s) */
function prune(){
  if (!S.data) return;
  var ids={}, fav={}; S.data.vacancies.forEach(function(v){ ids[v.id]=1; }); (S.data.fav||[]).forEach(function(id){ fav[id]=1; });
  var ap={}; (S.data.applied||[]).forEach(function(id){ ap[id]=1; });
  Object.keys(S.dec).forEach(function(id){ var d=S.dec[id]; if ((d==="f"&&fav[id]) || (d==="s"&&!ids[id]) || (d==="a"&&(ap[id]||!ids[id]))) delete S.dec[id]; });
}
function favIds(){ var f={}; (S.data.fav||[]).forEach(function(id){ f[id]=1; }); Object.keys(S.dec).forEach(function(id){ if(S.dec[id]==="f") f[id]=1; else delete f[id]; }); return f; }
function isApplied(id){ return S.dec[id]==="a" || (S.data.applied||[]).indexOf(id)>=0; }
function queue(){ var f=favIds(); return S.data.vacancies.filter(function(v){ return !f[v.id] && !S.dec[v.id] && !isApplied(v.id); }); }
function unsent(){ return Object.keys(S.dec).filter(function(id){ return S.sent[id]!==S.dec[id]; }); }
function pending(){ return unsent().length; }

/* ---------- отправка в бота ---------- */
/* кнопка «Радар» под полем ввода → sendData; любой другой запуск → ссылка t.me/<бот>?start=r<решения> (до 15 за раз) */
var canSend = !!(tg && tg.initData && !(tg.initDataUnsafe && tg.initDataUnsafe.query_id));
var canLink = !!(tg && tg.openTelegramLink);
function codeOf(id){ var v=S.data&&S.data.vacancies.filter(function(x){ return x.id===id; })[0]; return v&&v.k&&/^[0-9a-z]{3}$/.test(v.k)?v.k:null; }
function updateMainButton(){
  if (!tg || !tg.MainButton) return;
  var n = pending();
  if (n && (canSend||canLink)){ tg.MainButton.setParams({text:"Сохранить в Радар ("+n+")",is_visible:true}); }
  else tg.MainButton.hide();
}
if (tg && tg.MainButton){ tg.MainButton.onClick(function(){
  var ids=unsent(); if(!ids.length) return; haptic("medium");
  if (canSend){
    var d={}; ids.forEach(function(id){ d[id]=S.dec[id]; });
    var payload=JSON.stringify({v:1,d:d});
    if (payload.length>4000){ d={}; for(var i=0;i<ids.length;i++){ d[ids[i]]=S.dec[ids[i]]; if(JSON.stringify({v:1,d:d}).length>3900){ delete d[ids[i]]; break; } } payload=JSON.stringify({v:1,d:d}); }
    Object.keys(d).forEach(function(id){ S.sent[id]=d[id]; });
    saveDec(function(){ tg.sendData(payload); });
    return;
  }
  var p="r", used=[];
  for (var j=0;j<ids.length&&p.length<=60;j++){ var k=codeOf(ids[j]); if(!k){ S.sent[ids[j]]=S.dec[ids[j]]; continue; } p+=S.dec[ids[j]]+k; used.push(ids[j]); }
  used.forEach(function(id){ S.sent[id]=S.dec[id]; });
  saveDec(function(){ if(used.length) tg.openTelegramLink("https://t.me/"+BOT+"?start="+p); else toast("Нечего отправлять"); });
}); }

/* ---------- отрисовка ---------- */
function toast(t){ var el=$("toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(function(){ el.classList.remove("on"); },2200); }
function contactsNode(v, wrap){
  var cs=(v.contacts||[]).map(str).filter(Boolean).slice(0,3);
  if (!cs.length) wrap.append(h("span",{class:"lbl",text:"Контакты не указаны"}));
  else { wrap.append(h("span",{class:"lbl",text:"Контакты"})); cs.forEach(function(c){
    var m=/^@([A-Za-z0-9_]{4,})$/.exec(c.trim()), u=safeUrl(c.trim());
    wrap.append(m ? h("a",{href:"https://t.me/"+m[1],text:c.trim(),"data-tg":"1"}) : u ? h("a",{href:u,text:c.replace(/^https?:\/\//,"").slice(0,40)}) : h("span",{text:c}));
  }); }
  var url=safeUrl(v.url); if (url) wrap.append(h("a",{href:url,text:"Открыть вакансию ↗"}));
  return wrap;
}
function card(v, cls){
  var src = v.source==="hh" ? "hh.ru" : v.source==="telegram" ? "Telegram · "+str(v.sourceName) : str(v.sourceName)||"Сайт";
  return h("article",{class:"card glass "+cls,"data-id":v.id},[
    h("div",{class:"stamp yes",text:"В ИЗБРАННОЕ"}), h("div",{class:"stamp no",text:"ПРОПУСК"}),
    h("div",{class:"c-head"},[ h("div",{class:"c-src"},[h("span",{text:src}),h("span",{text:fmt(v.postedAt)})]),
      h("div",{class:"c-title",text:v.title||"Без названия"}),
      h("div",{class:"c-comp",text:[v.company||"Компания не указана",v.location].filter(Boolean).join(" · ")}),
      h("div",{class:"chips"},[v.salary?h("span",{class:"chip money",text:v.salary}):null, v.format?h("span",{class:"chip",text:v.format}):null]) ]),
    h("div",{class:"c-body",text:v.desc||"Текст вакансии не сохранён — откройте объявление по ссылке."}),
    contactsNode(v, h("div",{class:"c-foot"}))
  ]);
}
function renderMatch(){
  if (S.drag||S.busy) return;
  var deck=$("deck"), q=queue(); deck.textContent="";
  $("n-match").textContent = q.length||""; $("b-undo").disabled=!S.undo;
  $("b-no").disabled = $("b-yes").disabled = !q.length;
  if (!q.length){ deck.append(h("div",{class:"empty"},[h("b",{text:"Всё разобрано"}),
    h("span",{text: pending() ? "Нажмите «Сохранить в Радар» внизу, чтобы решения ушли в дашборд." : "Новые вакансии появятся после ближайшего сбора — в 9:13 и 15:13 по Москве."})])); return; }
  if (q[1]) deck.append(card(q[1],"back"));
  var c=card(q[0],"top"); deck.append(c); drag(c,q[0]);
}
function item(v, withRemove){
  var row=h("div",{class:"row"}); contactsNode(v,row);
  if (withRemove){
    row.append(h("button",{type:"button",text:"Я откликнулся",style:"color:var(--good)",onclick:function(){ S.dec[v.id]="a"; saveDec(); haptic("medium"); toast("Отмечено: отклик отправлен"); renderAll(); }}));
    row.append(h("button",{type:"button",text:"Убрать",onclick:function(){ S.dec[v.id]="s"; saveDec(); haptic("light"); toast("Убрано из избранного и из базы"); renderAll(); }}));
  }
  return h("div",{class:"item glass"},[ h("div",{class:"m",text:[v.source==="hh"?"hh.ru":str(v.sourceName),fmt(v.postedAt)].filter(Boolean).join(" · ")}),
    h("div",{class:"t",text:v.title||"Без названия"}), h("div",{class:"m",text:[v.company,v.salary,v.format].filter(Boolean).join(" · ")}),
    v.desc ? h("details",{},[h("summary",{text:"Описание"}),h("p",{text:v.desc})]) : null, row ]);
}
function renderLists(){
  var f=favIds(), fav=S.data.vacancies.filter(function(v){ return f[v.id]; });
  $("n-fav").textContent=fav.length||""; var box=$("fav"); box.textContent="";
  if (!fav.length) box.append(h("div",{class:"empty",style:"height:60vh"},[h("b",{text:"Пока пусто"}),h("span",{text:"Смахните вакансию вправо в МЭТЧ — она появится здесь."})]));
  if (fav.length) box.append(h("p",{class:"note",text:"Сопроводительное письмо для каждой вакансии из избранного приходит в чат с ботом после ближайшего сбора. Отправили отклик — нажмите «Я откликнулся»."}));
  fav.forEach(function(v){ box.append(item(v,true)); });
  if (pending()) box.append(h("p",{class:"note",text:"Есть несохранённые решения: нажмите «Сохранить в Радар» внизу. Дашборд обновится при ближайшем сборе."}));
  var q=$("q").value.trim().toLowerCase(), all=S.data.vacancies.filter(function(v){ return S.dec[v.id]!=="s" && !isApplied(v.id) && (!q || (v.title+" "+v.company+" "+v.desc).toLowerCase().indexOf(q)>=0); });
  $("n-all").textContent=(typeof S.data.total==="number"?S.data.total:S.data.vacancies.length)||""; var ab=$("all"); ab.textContent="";
  if (!all.length) ab.append(h("p",{class:"note",text:"Ничего не найдено."}));
  all.slice(0,200).forEach(function(v){ ab.append(item(v,false)); });
}
function renderAll(){ renderMatch(); renderLists(); }

/* ---------- свайпы ---------- */
function setX(c,dx){ c.style.transform="translateX("+dx+"px) rotate("+(dx/18)+"deg)"; var k=Math.min(1,Math.abs(dx)/100);
  c.querySelector(".stamp.yes").style.opacity=dx>0?k:0; c.querySelector(".stamp.no").style.opacity=dx<0?k:0; }
function drag(c,v){
  var sx,sy,dx=0,id=null,on=false,t0;
  c.addEventListener("pointerdown",function(e){ if(e.target.closest("a,button,summary")) return; id=e.pointerId; sx=e.clientX; sy=e.clientY; dx=0; on=false; t0=Date.now(); });
  c.addEventListener("pointermove",function(e){ if(e.pointerId!==id) return; var mx=e.clientX-sx, my=e.clientY-sy;
    if(!on){ if(Math.abs(mx)>8&&Math.abs(mx)>Math.abs(my)){ on=true; S.drag=true; try{c.setPointerCapture(id);}catch(_){} } else if(Math.abs(my)>10) id=null; return; }
    var was=Math.abs(dx)>100; dx=mx; setX(c,dx); if(!was&&Math.abs(dx)>100) haptic("s"); });
  function end(e){ if(e.pointerId!==id) return; id=null; if(!on) return; on=false; S.drag=false;
    var fast=Math.abs(dx)/Math.max(1,Date.now()-t0)>.6&&Math.abs(dx)>50;
    if (dx>100||(fast&&dx>0)) decide(v,"f",c); else if (dx<-100||(fast&&dx<0)) decide(v,"s",c);
    else { c.classList.add("snap"); setX(c,0); setTimeout(function(){ c.classList.remove("snap"); },300); } }
  c.addEventListener("pointerup",end); c.addEventListener("pointercancel",end);
}
function decide(v,d,c){
  if (S.busy) return; c=c||$("deck").querySelector(".card.top"); if(!c) return; S.busy=true;
  c.classList.add("fly"); c.style.transform="translateX("+(d==="f"?1:-1)*c.offsetWidth*1.5+"px) rotate("+(d==="f"?24:-24)+"deg)"; c.style.opacity="0";
  c.querySelector(".stamp."+(d==="f"?"yes":"no")).style.opacity=1; haptic(d==="f"?"medium":"light");
  setTimeout(function(){ S.busy=false; S.dec[v.id]=d; S.undo=v.id; saveDec(); toast(d==="f"?"В избранном":"Пропущено"); renderAll(); },
    matchMedia("(prefers-reduced-motion: reduce)").matches?0:320);
}
$("b-yes").onclick=function(){ var v=queue()[0]; if(v) decide(v,"f"); };
$("b-no").onclick=function(){ var v=queue()[0]; if(v) decide(v,"s"); };
$("b-undo").onclick=function(){ if(!S.undo) return; delete S.dec[S.undo]; S.undo=null; saveDec(); haptic("light"); toast("Вернул карточку"); renderAll(); };
$("q").addEventListener("input",renderLists);
document.querySelectorAll(".tabbar button").forEach(function(b){ b.onclick=function(){
  document.querySelectorAll(".tabbar button").forEach(function(x){ x.setAttribute("aria-selected",String(x===b)); });
  ["match","fav","all"].forEach(function(n){ $("v-"+n).hidden = n!==b.dataset.v; }); haptic("s"); }; });
document.addEventListener("click",function(e){ var a=e.target.closest("a[href]"); if(!a||!tg) return; e.preventDefault();
  if (a.dataset.tg || /^https:\/\/t\.me\//.test(a.href)) tg.openTelegramLink(a.href); else tg.openLink(a.href); });

/* ---------- загрузка ---------- */
$("deck").append(h("div",{class:"empty"},[h("span",{text:"Загружаю вакансии…"})]));
Promise.all([fetch("data.json?t="+Date.now(),{cache:"no-store"}).then(function(r){ if(!r.ok) throw 0; return r.json(); }), loadDec()]).then(function(r){
  S.data=r[0]; S.data.vacancies=(S.data.vacancies||[]).filter(function(v){ return v&&v.id; }); S.dec=r[1]||{};
  prune(); saveDec(); $("upd").textContent = S.data.updated ? "обновлено "+fmt(S.data.updated) : ""; renderAll();
}).catch(function(){ $("deck").textContent=""; $("deck").append(h("div",{class:"empty"},[h("b",{text:"Не удалось загрузить вакансии"}),h("span",{text:"Проверьте интернет и откройте приложение ещё раз."})])); });
})();
</script>
